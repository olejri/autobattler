<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#1a2e1a" stroke="#40e050" stroke-width="3"/>
  <!-- Staff -->
  <line x1="32" y1="52" x2="32" y2="14" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Holy cross/ankh at top -->
  <circle cx="32" cy="14" r="5" fill="none" stroke="#ffd700" stroke-width="2.5"/>
  <!-- Cross horizontal -->
  <line x1="25" y1="22" x2="39" y2="22" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Glow effect -->
  <circle cx="32" cy="18" r="10" fill="none" stroke="#80ff80" stroke-width="1" opacity="0.6"/>
  <!-- Heal sparkles -->
  <line x1="20" y1="38" x2="20" y2="44" stroke="#80ff80" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="41" x2="23" y2="41" stroke="#80ff80" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="36" x2="44" y2="42" stroke="#80ff80" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="39" x2="47" y2="39" stroke="#80ff80" stroke-width="1.5" stroke-linecap="round"/>
</svg>

